<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtro Adaptativo — Função de Portfólio de Crédito</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">

  <h1 id="textao">Filtro Adaptativo <span>— Portfólio de Crédito</span></h1>


  <div class="card">
    <div class="controls-row">
      <div class="control-group">
        <label for="var-select">Variável ativa:</label>
        <select id="var-select">
          <option value="t">t - prazo (anos)</option>
          <option value="u">ū - taxa média de juros</option>
          <option value="LGD">LGD - perda dado default</option>
          <option value="L">L_k - valor do empréstimo</option>
        </select>
      </div>
    </div>
  </div>

  <div class="canvas-wrap card" style="padding:0;">
    <div id="p5-container"></div>
  </div>

  <div class="card table-wrap">
    <table>
      <colgroup>
        <col style="width:44px"/>
        <col style="width:60px"/>
        <col style="width:60px"/>
        <col style="width:60px"/>
        <col style="width:80px"/>
        <col style="width:75px"/>
        <col style="width:auto"/>
      </colgroup>
      <thead>
        <tr>
          <th>k</th>
          <th>t</th>
          <th>ū</th>
          <th>LGD</th>
          <th>L_k</th>
          <th>c_k</th>
          <th>contribuição</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
      <tfoot>
        <tr>
          <td colspan="5" class="obj-label">Objetivo total</td>
          <td class="obj-val" id="obj-val">—</td>
        </tr>
      </tfoot>
    </table>
  </div>

</div>

<script src="p5.js"> </script>
</body>
</html>
